name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The Linux build runs in a Debian 13 container so the binary links
    # against trixie's glibc rather than the newer one on the GitHub runner,
    # keeping it loadable on any distro at least as recent.
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            container: rust:1-trixie
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            container: ""
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            container: ""
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -C target/release -czf \
            "vidgrid-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" vidgrid
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/release/vidgrid.exe `
            -DestinationPath "vidgrid-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vidgrid-*.tar.gz
            vidgrid-*.zip
