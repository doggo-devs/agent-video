name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # Linux builds run in a Debian 13 container so the binary links against
    # trixie's glibc rather than the newer one on the GitHub runner, keeping
    # it loadable on any distro at least as recent.
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            container: rust:1-trixie
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            container: rust:1-trixie
            target: aarch64-unknown-linux-gnu
          - platform: darwin-x64
            os: macos-latest
            container: ""
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            os: macos-latest
            container: ""
            target: aarch64-apple-darwin
          - platform: win32-x64
            os: windows-latest
            container: ""
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches crate version
        shell: bash
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          [ "v$crate" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME != crate version $crate" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Always build with an explicit --target so the output path is uniform
      # (target/<triple>/release) across native and cross builds.
      - run: cargo build --release --target ${{ matrix.target }}

      # Raw binary for the npm publish job (exec bit is restored there).
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/agent-video${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -C "target/${{ matrix.target }}/release" -czf \
            "agent-video-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" agent-video
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/agent-video.exe" `
            -DestinationPath "agent-video-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-video-*.tar.gz
            agent-video-*.zip

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate and publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            bin="artifacts/bin-$platform/agent-video"
            [ -f "$bin" ] || bin="$bin.exe"
            node scripts/npm-platform.mjs "$platform" "$version" "$bin" "dist/$platform"
            npm publish "dist/$platform" --provenance --access public
          done

      # After the platform packages: the CLI exact-pins them, and the pins
      # are injected here rather than committed so local installs never
      # depend on published versions existing. Ships TS source (bun runs it
      # directly), so no install or build before publish.
      - name: Publish CLI
        working-directory: packages/harness
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm pkg set "optionalDependencies.@agent-video/$platform=$version"
          done
          npm publish --provenance --access public
