name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    # Linux builds run in a Debian 13 (trixie) container so the binary links
    # against trixie's glibc rather than the newer one on the GitHub runner,
    # keeping it loadable on any distro at least as recent.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # `npm_platform` marks the variant that feeds the @agent-video/<platform>
        # npm package: static on Linux (self-contained is the point of npm
        # installs), dynamic elsewhere. Release tarballs ship every variant —
        # dynamic without a suffix, static with `-static`.
        include:
          # --- Linux x86_64 -----------------------------------------------
          # dynamic: links the system FFmpeg; runs on hosts with a matching
          # FFmpeg major installed (the trixie build env determines the soname).
          - os: ubuntu-latest
            container: rust:1-trixie
            target: x86_64-unknown-linux-gnu
            variant: dynamic
          # static: self-contained, software AV1 via bundled dav1d, no hwaccel.
          - os: ubuntu-latest
            container: rust:1-trixie
            target: x86_64-unknown-linux-gnu
            variant: static
            ffmpeg_cpu: x86-64-v3
            npm_platform: linux-x64
          # fully-static musl: FFmpeg + dav1d + openssl + libc all linked in,
          # a single file with no dynamic dependencies. Distributed as an extra
          # tarball variant; the gnu static build stays the npm default.
          - os: ubuntu-latest
            container: rust:1-trixie
            target: x86_64-unknown-linux-musl
            variant: static
            ffmpeg_cpu: x86-64-v3

          # --- Linux aarch64 (native arm runner, no cross-compile) --------
          - os: ubuntu-24.04-arm
            container: rust:1-trixie
            target: aarch64-unknown-linux-gnu
            variant: dynamic
          - os: ubuntu-24.04-arm
            container: rust:1-trixie
            target: aarch64-unknown-linux-gnu
            variant: static
            ffmpeg_cpu: armv8-a
            npm_platform: linux-arm64

          # --- macOS x86_64 (dynamic; requires `brew install ffmpeg`) ------
          - os: macos-15-intel
            container: ""
            target: x86_64-apple-darwin
            variant: dynamic
            npm_platform: darwin-x64

          # --- macOS aarch64 (dynamic; requires `brew install ffmpeg`) -----
          - os: macos-latest
            container: ""
            target: aarch64-apple-darwin
            variant: dynamic
            npm_platform: darwin-arm64

          # --- Windows x86_64 (dynamic; FFmpeg DLLs bundled) ---------------
          - os: windows-latest
            container: ""
            target: x86_64-pc-windows-msvc
            variant: dynamic
            npm_platform: win32-x64
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches crate version
        shell: bash
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          [ "v$crate" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME != crate version $crate" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      # --- FFmpeg / build-tool provisioning -----------------------------------
      - name: Install build deps (Linux, static)
        if: runner.os == 'Linux' && matrix.variant == 'static'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential nasm meson ninja-build pkg-config git perl
      - name: Install musl toolchain + rustup target (Linux, musl)
        if: contains(matrix.target, 'musl')
        run: |
          apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.target }}
      - name: Install FFmpeg dev libs (Linux, dynamic)
        if: runner.os == 'Linux' && matrix.variant == 'dynamic'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev pkg-config
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - name: Install FFmpeg (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: |
          vcpkg install ffmpeg[avcodec,avformat,avutil,swscale]:x64-windows
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant }}

      # --- Build --------------------------------------------------------------
      # Static builds route through build-static.sh; a musl target sets TARGET
      # so the C deps compile against musl and cargo cross-builds, landing the
      # binary under target/<triple>/release instead of target/release.
      - name: Build (static)
        if: matrix.variant == 'static'
        env:
          FFMPEG_TARGET_CPU: ${{ matrix.ffmpeg_cpu }}
          TARGET: ${{ contains(matrix.target, 'musl') && matrix.target || '' }}
        run: ./scripts/build-static.sh
      - name: Build (dynamic)
        if: matrix.variant == 'dynamic'
        run: cargo build --release

      # Resolve the release output dir: gnu static + dynamic land in
      # target/release; a cross-built musl target lands in target/<triple>/release.
      - name: Resolve output dir
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            echo "OUT_DIR=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"
          else
            echo "OUT_DIR=target/release" >> "$GITHUB_ENV"
          fi

      # --- Package ------------------------------------------------------------
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          suffix=""
          [ "${{ matrix.variant }}" = "static" ] && suffix="-static"
          tar -C "$OUT_DIR" -czf \
            "agent-video-${GITHUB_REF_NAME}-${{ matrix.target }}${suffix}.tar.gz" agent-video
      - name: Package (windows, bundle FFmpeg DLLs)
        if: runner.os == 'Windows'
        run: |
          $stage = "stage/agent-video"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/agent-video.exe $stage
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" $stage
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "agent-video-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"

      # Raw binary for the npm publish job (exec bit is restored there). The
      # Windows artifact is the staged exe + FFmpeg DLLs, which must travel
      # together into the npm package's bin/.
      - uses: actions/upload-artifact@v4
        if: matrix.npm_platform != '' && runner.os != 'Windows'
        with:
          name: bin-${{ matrix.npm_platform }}
          path: target/release/agent-video
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.npm_platform != '' && runner.os == 'Windows'
        with:
          name: bin-${{ matrix.npm_platform }}
          path: stage/agent-video/*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-video-*.tar.gz
            agent-video-*.zip

  # A tag must never ship stale discovery surfaces; same check as ci.yml.
  surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run gen:surfaces
      - run: git add -N surfaces .agents && git diff --exit-code surfaces .agents

  publish-npm:
    needs: [build, surfaces]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate and publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            node scripts/npm-platform.mjs "$platform" "$version" \
              "artifacts/bin-$platform" "dist/$platform"
            npm publish "dist/$platform" --provenance --access public
          done

      # After the platform packages: the CLI exact-pins them, and the pins
      # are injected here rather than committed so local installs never
      # depend on published versions existing. Ships TS source (bun runs it
      # directly), so no install or build before publish.
      - name: Publish CLI
        working-directory: packages/harness
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm pkg set "optionalDependencies.@agent-video/$platform=$version"
          done
          npm publish --provenance --access public
