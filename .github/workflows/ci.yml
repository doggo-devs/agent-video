name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The crate links FFmpeg via pkg-config, so the dev libraries and headers
      # must be present to compile the tests and clippy targets. Vulkan headers
      # + glslc compile the whisper-vulkan feature (below); cmake is on the
      # runner image already.
      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev pkg-config \
            libvulkan-dev glslc ffmpeg
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check documentation links
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test
        env:
          AV_REQUIRE_MEDIA_TESTS: 1
      # The release GPU variant ships `whisper-vulkan`; its feature-gated code
      # (gpu probe, local route) must compile and pass on every push, not be
      # discovered broken at tag time. The runner has no GPU: the probe-driven
      # tests use injected fakes, and nothing enumerates a real device.
      - run: cargo clippy -p agent-video-harness --all-targets --features whisper-vulkan -- -D warnings
      - run: cargo test -p agent-video-harness --features whisper-vulkan
        env:
          AV_REQUIRE_MEDIA_TESTS: 1

  # The npm package is a pure distribution shell around the Rust binary;
  # smoke-test binary resolution and arg passthrough under plain node.
  cli-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test CLI stub
        run: |
          printf '#!/bin/sh\necho agent-video 0.0.0-fake "$@"\n' > /tmp/fake-core
          chmod +x /tmp/fake-core
          out="$(AGENT_VIDEO_BIN=/tmp/fake-core node packages/harness/cli.mjs --version)"
          echo "$out" | grep -q "agent-video 0.0.0-fake --version"
          # Missing platform package must fail with the install hint, not a stack trace.
          if node packages/harness/cli.mjs --version 2>err.log; then
            echo "expected failure without a platform package" >&2; exit 1
          fi
          grep -q "core binary not found" err.log

  # Generated discovery surfaces must match the Rust tool schema (pinned as
  # surfaces/video.schema.json by the pinned_surface_schema_is_current test)
  # + the version.
  surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run gen:surfaces
      # -N stages new files as intent-to-add so the diff also catches them
      - run: git add -N surfaces .agents && git diff --exit-code surfaces .agents
