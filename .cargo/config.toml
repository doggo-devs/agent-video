# x86-64-v3 (AVX2/FMA/BMI, ~all CPUs since 2015) vectorizes the convolution and
# pixel loops: ~39% faster on compute-heavy runs, output unchanged. Override with
# RUSTFLAGS to target a baseline if distributing to older hardware. Scoped to
# x86_64: a global [build] entry would pass this CPU to non-x86 targets
# (e.g. Apple-silicon builds) and fail.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

# The release/distribution build: FFmpeg + dav1d + musl in one static-pie,
# zero runtime dependencies. Use `./scripts/build-static.sh` — it runs in an
# Alpine container that builds static dav1d and puts it on PKG_CONFIG_PATH,
# which the `static-ffmpeg` feature needs for `--enable-libdav1d` (software
# AV1). Running the feature bare (no deps on PKG_CONFIG_PATH) makes FFmpeg's
# configure fail. Plain `cargo build --release` still links the system FFmpeg
# dynamically for fast iteration.
