[package]
name = "agent-video"
version.workspace = true
edition.workspace = true
description = "Turn a video into VLM-readable grid images"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[lints]
workspace = true

[[bin]]
name = "agent-video"
path = "src/main.rs"

[features]
# Pass-throughs so one `-p agent-video --features …` invocation configures
# the whole binary; the member crates own the actual wiring.
static-ffmpeg = ["agent-video-core/static-ffmpeg"]

[dependencies]
agent-video-core = { path = "../core", features = ["clap"] }
agent-video-harness = { path = "../harness" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Restore SIGPIPE to SIG_DFL at startup: the Rust runtime installs SIG_IGN,
# which turns a closed downstream pipe (e.g. `| head`) into an EPIPE panic
# under `panic = "abort"` instead of a clean signal termination.
libc = { workspace = true }
