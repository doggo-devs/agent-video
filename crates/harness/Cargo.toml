[package]
name = "agent-video-harness"
version.workspace = true
edition.workspace = true
description = "Turn a video into VLM-readable grid images — MCP harness"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
# `whisper-local`: local GPU inference via whisper.cpp. Any GPU feature
# implies this; builds without it use the API-only transcription path.
# CPU-only local inference is not supported.
whisper-local = ["dep:whisper-rs"]
whisper-metal = ["whisper-local", "whisper-rs/metal"]
whisper-coreml = ["whisper-local", "whisper-rs/coreml"]
whisper-cuda = ["whisper-local", "whisper-rs/cuda"]
whisper-vulkan = ["whisper-local", "whisper-rs/vulkan"]

[dependencies]
agent-video-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "1"
dirs = "6"
sha2 = "0.11"
ureq = "3"
whisper-rs = { version = "0.16", optional = true }
rmcp = { version = "2", default-features = false, features = [
    "server",
    "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
# Kill an expired child's whole process group, not just the direct child:
# a yt-dlp-spawned ffmpeg must not survive holding the output pipes.
libc = "0.2"
