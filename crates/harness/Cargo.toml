[package]
name = "agent-video-harness"
version.workspace = true
edition.workspace = true
description = "Turn a video into VLM-readable grid images — MCP harness"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[lints]
workspace = true

[dependencies]
agent-video-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = "1"
dirs = "6"
sha2 = "0.11"
ureq = "3"
# Statically linked by default: the build script fetches a prebuilt
# `-static-lib` archive, so no onnxruntime is required on the host and the
# binary carries no new dynamic dependency.
sherpa-onnx = "1.13.4"
rmcp = { version = "2", default-features = false, features = [
    "server",
    "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
# Kill an expired child's whole process group, not just the direct child:
# a yt-dlp-spawned ffmpeg must not survive holding the output pipes.
libc = { workspace = true }
