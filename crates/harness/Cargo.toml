[package]
name = "agent-video-harness"
version.workspace = true
edition.workspace = true
description = "Turn a video into VLM-readable grid images — MCP harness"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
# Whisper GPU backends are compile-time opt-ins: linking one adds a load-time
# dependency on the GPU runtime, so a host lacking it fails to exec before any
# `use_gpu` fallback could run. The default build is CPU-only. macOS release
# builds add metal+coreml (the frameworks are always present, so the fallback
# genuinely works there); other platforms' GPU builds are deliberate choices.
whisper-metal = ["whisper-rs/metal"]
whisper-coreml = ["whisper-rs/coreml"]
whisper-cuda = ["whisper-rs/cuda"]
whisper-vulkan = ["whisper-rs/vulkan"]

[dependencies]
agent-video-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "1"
dirs = "6"
sha2 = "0.11"
ureq = "3"
whisper-rs = "0.16"
rmcp = { version = "2", default-features = false, features = [
    "server",
    "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
# Kill an expired child's whole process group, not just the direct child:
# a yt-dlp-spawned ffmpeg must not survive holding the output pipes.
libc = "0.2"
