[package]
name = "agent-video"
version.workspace = true
edition.workspace = true
description = "Turn a video into VLM-readable grid images"
license.workspace = true
repository.workspace = true
# Rust-side README lives one level up, shared across future core crates.
readme = "../README.md"

[[bin]]
name = "agent-video"
path = "src/main.rs"

[features]
# Zero-dependency release build: compile FFmpeg from source at build time and
# link it statically, so the binary needs no ffmpeg installation at runtime.
# `build-lib-dav1d` adds `--enable-libdav1d` so software AV1 decoding works
# (FFmpeg's native AV1 decoder is a hardware-only stub); dav1d must be present
# as a static lib on PKG_CONFIG_PATH at build time — see scripts/build-static.sh.
# Requires a C toolchain + nasm + network access on first build. Day-to-day
# builds link the system FFmpeg via pkg-config instead (fast).
static-ffmpeg = ["ffmpeg-next/build", "ffmpeg-next/static", "ffmpeg-next/build-lib-dav1d"]

[dependencies]
ffmpeg-next = { version = "8", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
] }
image = "0.25"
image_hasher = "3"
imageproc = "0.27"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# Restore SIGPIPE to SIG_DFL at startup: the Rust runtime installs SIG_IGN,
# which turns a closed downstream pipe (e.g. `| head`) into an EPIPE panic
# under `panic = "abort"` instead of a clean signal termination.
libc = "0.2"
