[package]
name = "agent-video-core"
version.workspace = true
edition.workspace = true
description = "Turn a video into VLM-readable grid images — media kernel"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[lints]
workspace = true

[features]
# CLI argument surface: derives `clap::Args`/`ValueEnum` on the config
# override structs so the CLI flags and the override fields stay one
# declaration. Off by default — a library consumer gets a clap-free core;
# the CLI crate turns it on.
clap = ["dep:clap"]
# Zero-dependency release build: compile FFmpeg from source and link it
# statically. `build-lib-dav1d` adds `--enable-libdav1d` (software AV1); the
# static lib must be on PKG_CONFIG_PATH at build time — see
# scripts/build-static.sh. No TLS backend: URL downloads happen in the harness
# (rustls), so FFmpeg only ever opens local files; a direct `https://` input
# fails with PROTOCOL_UNSUPPORTED. Day-to-day builds link the system FFmpeg
# via pkg-config instead (fast).
static-ffmpeg = [
    "ffmpeg-next/build",
    "ffmpeg-next/static",
    "ffmpeg-next/build-lib-dav1d",
]

[dependencies]
ffmpeg-next = { version = "8", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
    "software-resampling",
] }
image = "0.25"
image_hasher = "3"
imageproc = "0.27"
ab_glyph = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, optional = true }
rayon = "1"
base64 = "0.22"

[dev-dependencies]
# Interop pin only: `preserves_error_code_through_context` proves a coded
# Error survives an anyhow consumer's `.context()` wrapping.
anyhow = { workspace = true }
