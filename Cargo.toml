[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/durvia/agent-video"

# Profiles only apply at the workspace root; member-level profiles are ignored.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
