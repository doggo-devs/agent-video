[workspace]
resolver = "3"
members = ["crates/core", "crates/harness", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/durvia/agent-video"

# Versions shared by more than one member live here so they cannot drift
# crate-by-crate; single-user dependencies stay in their member manifest.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

# Profiles only apply at the workspace root; member-level profiles are ignored.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
