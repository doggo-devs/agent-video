[package]
name = "vidgrid-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vidgrid"
path = "src/main.rs"

[dependencies]
image = "0.25"
image_hasher = "3"
imageproc = "0.25"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"

[profile.release]
strip = true
lto = true
