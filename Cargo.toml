[workspace]
resolver = "3"
members = ["crates/core", "crates/harness", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/doggo-devs/agent-video"

# Versions shared by more than one member live here so they cannot drift
# crate-by-crate; single-user dependencies stay in their member manifest.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

# One lint policy for every member; each crate opts in via `lints.workspace`.
# CI runs `cargo clippy -- -D warnings`, so a "warn" here is a hard gate.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Mechanical enforcement of the SAFETY-comment convention: every `unsafe`
# block must be preceded by a `// SAFETY:` justification.
undocumented_unsafe_blocks = "warn"

# Profiles only apply at the workspace root; member-level profiles are ignored.
[profile.release]
strip = true
lto = true
codegen-units = 1
# Release binaries abort on panic. The library's panic-recovery paths
# (`FrameSource::next_frame`'s join handling, the chunk-worker
# `catch_unwind` in pipeline/state.rs) serve unwind builds — tests and
# downstream consumers on the default profile; here the process terminates
# before reaching them.
panic = "abort"
